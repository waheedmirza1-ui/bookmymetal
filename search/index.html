<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — BookMyMetal</title><link rel="stylesheet" href="../assets/bmm.css"><link rel="stylesheet" href="../assets/marketplace-v3.css"><script src="../assets/marketplace-data.js" defer></script></head>
<body><header class="top"><a class="logo" href="../marketplace/">BOOK<span>MY</span>METAL</a><nav><a href="../marketplace/">Marketplace</a><a href="../categories/">Categories</a><a href="../suppliers/">Suppliers</a><a href="../rfq/">My RFQs</a></nav><a class="btn blue" href="../account/">Sign in</a></header><section class="searchdock"><form class="search" id="searchForm"><input id="q" name="q" placeholder="Describe what you need — product, specification, quantity or location" aria-label="Search marketplace"><button class="blue">Search</button></form></section><main class="detail"><div class="sectionhead"><label>MARKETPLACE SEARCH</label><h1 id="title">Discover through video</h1><p id="subtitle">Category routing is available. Live supplier matching is shown only when approved marketplace data is connected.</p></div><div class="search-state" id="state"></div></main><script>window.addEventListener('DOMContentLoaded',function(){var input=document.getElementById('q'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),state=document.getElementById('state');function render(){var query=new URLSearchParams(location.search).get('q')||'';input.value=query;if(!query){state.innerHTML='<div class="emptyState"><strong>Start with a requirement</strong><span>Search a product, service, application or business need.</span></div>';return}var category=window.BMMMarketplaceData&&window.BMMMarketplaceData.resolveCategory(query);title.textContent=category?category.name:'Search request';subtitle.textContent=category?'Your request maps to this marketplace category.':'No category match is available yet.';state.innerHTML=category?'<div class="discovery-empty"><div><label>CATEGORY MATCH</label><h2>'+category.name+'</h2><p>Public supplier matches will appear once approved marketplace data is connected. You can still submit a requirement with your specifications.</p></div><div class="discovery-actions"><a class="btn blue" href="../rfq/">Post requirement</a><a class="btn" href="../categories/">Browse categories</a></div></div>':'<div class="emptyState"><strong>No verified public matches yet</strong><span>BookMyMetal will not invent suppliers or product videos. Refine the request or post it as an RFQ.</span><a class="btn blue" href="../rfq/">Post requirement</a></div>'}document.getElementById('searchForm').addEventListener('submit',function(e){e.preventDefault();location.href='./?q='+encodeURIComponent(input.value.trim())});render()});</script></body>
</html>
